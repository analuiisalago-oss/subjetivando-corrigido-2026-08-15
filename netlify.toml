[build]
  publish = "public"
  # Sem build desde 09/09/2026: public/ é a FONTE do site e vai ao ar como está.
  # O antigo scripts/build_public.py regenerava public/ a partir de um HTML
  # congelado e apagava o design atual sem erro; foi removido em 10/09/2026.
  # Não criar comando que escreva em public/. Ver docs/PENDENCIAS.md, P2-14.
  # O package.json serve só às ferramentas da máquina (npm run dev, check,
  # css, vendor); nada dele é necessário para publicar.
  command = ""

[build.processing]
  skip_processing = false
